apiVersion: apps/v1
kind: Deployment
metadata:
  name: trie-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trie-server
  template:
    metadata:
      labels:
        app: trie-server
    spec:
      containers:
        - name: server
          image: localhost/trie-server:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051